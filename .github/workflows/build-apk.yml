name: Build Frienzo APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, delivery]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ matrix.app }}
        run: npx cap add android

      - name: Rider permissions (background GPS)
        if: matrix.app == 'delivery'
        run: bash scripts/patch-manifest.sh ${{ matrix.app }}

      - name: Customer location permission
        if: matrix.app == 'customer'
        run: |
          M=customer/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <application#' $M

      - name: Generate app icons
        working-directory: ${{ matrix.app }}
        run: |
          node -e "require('sharp')({create:{width:1024,height:1024,channels:3,background:'#ffffff'}}).png().toFile('assets/icon-background.png').then(()=>console.log('background created'))"
          npx capacitor-assets generate --android

      - name: Sync
        working-directory: ${{ matrix.app }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ matrix.app }}/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: frienzo-${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/android/app/build/outputs/apk/debug/*.apk
